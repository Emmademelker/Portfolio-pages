    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 5vh 7vw;
    }

    #book {

      height: 100%;
    }

    .page {
      background: #ffffff;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #ffffff;
      user-select: none;
      -webkit-user-drag: none;
    }

    .cover {
      background: #ffffff;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1000;
      border: 0;
      background: transparent;
      font-size: 28px;
      font-weight: 300;
      cursor: pointer;
      color: #111;
      opacity: .35;
      padding: 20px;
      transition: opacity .2s ease;
    }

    .nav:hover {
      opacity: .9;
    }

    #prev {
      left: 1.2%;
    }

    #next {
      right: 1.2%;
    }

    .counter {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: .13em;
      color: #111;
      opacity: .35;
      z-index: 1000;
    }

    @media (max-width: 800px) {
      .viewer {
        padding: 3vh 3vw;
      }

      .nav {
        font-size: 21px;
        padding: 8px;
      }

      #prev {
        left: 0;
      }

      #next {
        right: 0;
      }
    }
  </style>
</head>

  <script>
    const bookElement = document.getElementById("book");

    const pageFlip = new St.PageFlip(bookElement, {
      width: 720,
      height: 509,

      size: "stretch",

      minWidth: 300,
      maxWidth: 850,

      minHeight: 212,
      maxHeight: 601,

      maxShadowOpacity: 0.22,

      showCover: true,

      mobileScrollSupport: false,

      usePortrait: true,

      startPage: 0,

      drawShadow: true,

      flippingTime: 1150,

      clickEventForward: true,

      useMouseEvents: true,

      swipeDistance: 30,

      showPageCorners: true,

      disableFlipByClick: false
    });

    pageFlip.loadFromHTML(
      document.querySelectorAll(".page")
    );

    const counter =
      document.getElementById("counter");

    pageFlip.on("flip", (event) => {
      const current =
        event.data + 1;

      counter.textContent =
        String(current).padStart(2, "0") +
        " / 49";
    });

    document
      .getElementById("next")
      .addEventListener("click", () => {
        pageFlip.flipNext("bottom");
      });

    document
      .getElementById("prev")
      .addEventListener("click", () => {
        pageFlip.flipPrev("bottom");
      });

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "ArrowRight") {
          pageFlip.flipNext("bottom");
        }

        if (event.key === "ArrowLeft") {
          pageFlip.flipPrev("bottom");
        }
      }
    );
  </script>
