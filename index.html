  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    /* -----------------------------
       INTRO COVER
    ----------------------------- */

    #introCover {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 20;

      transform: translateX(0);

      transition:
        transform 1.05s cubic-bezier(.22,.8,.25,1),
        opacity .55s ease;
    }

    #introCover img {
      width: min(42vw, 620px);
      height: auto;
      display: block;

      cursor: pointer;

      transform:
        rotate(-4deg)
        scale(1);

      transform-origin: center center;

      transition:
        transform .9s cubic-bezier(.22,.8,.25,1);
    }

    #introCover:hover img {
      transform:
        rotate(-2deg)
        scale(1.025);
    }

    /* first click: straighten */

    #introCover.straight img {
      transform:
        rotate(0deg)
        scale(.98);
    }

    /* then glide left */

    #introCover.shift-left {
      transform:
        translateX(-16vw);
    }

    /* fade the intro away */

    #introCover.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* -----------------------------
       REAL FLIPBOOK
    ----------------------------- */

    #bookStage {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 5vh 7vw;

      opacity: 0;
      pointer-events: none;

      transform: scale(.985);

      transition:
        opacity .65s ease,
        transform .8s cubic-bezier(.22,.8,.25,1);
    }

    #bookStage.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    #book {
      width: 100%;
      height: 100%;
    }

    .page {
      background: #ffffff;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      background: #ffffff;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* -----------------------------
       MOBILE
    ----------------------------- */

    @media (max-width: 800px) {

      #introCover img {
        width: min(72vw, 520px);
      }

      #introCover.shift-left {
        transform:
          translateX(-10vw);
      }

      #bookStage {
        padding: 3vh 2vw;
      }

    }

  </style>
</head>

  <script>

    const introCover =
      document.getElementById("introCover");

    const bookStage =
      document.getElementById("bookStage");

    const bookElement =
      document.getElementById("book");


    const pageFlip =
      new St.PageFlip(bookElement, {

        width: 720,
        height: 509,

        size: "stretch",

        minWidth: 300,
        maxWidth: 850,

        minHeight: 212,
        maxHeight: 601,

        showCover: true,

        drawShadow: true,

        maxShadowOpacity: 0.20,

        flippingTime: 1200,

        mobileScrollSupport: false,

        usePortrait: true,

        startPage: 0,

        clickEventForward: true,

        useMouseEvents: true,

        swipeDistance: 25,

        showPageCorners: true,

        disableFlipByClick: false

      });


    pageFlip.loadFromHTML(
      document.querySelectorAll(".page")
    );


    let opened = false;


    function openPortfolio() {

      if (opened) {
        return;
      }

      opened = true;


      /*
      STEP 1:
      straighten
      */

      introCover.classList.add("straight");


      /*
      STEP 2:
      glide left
      */

      setTimeout(() => {

        introCover.classList.add("shift-left");

      }, 280);


      /*
      STEP 3:
      reveal actual book
      */

      setTimeout(() => {

        bookStage.classList.add("visible");

      }, 650);


      /*
      STEP 4:
      fade intro away
      */

      setTimeout(() => {

        introCover.classList.add("hide");

      }, 900);


      /*
      STEP 5:
      open first page
      */

      setTimeout(() => {

        pageFlip.flipNext("bottom");

      }, 1150);

    }


    introCover.addEventListener(
      "click",
      openPortfolio
    );


    document.addEventListener(
      "keydown",
      event => {

        if (!opened) {

          if (
            event.key === "Enter" ||
            event.key === "ArrowRight"
          ) {

            openPortfolio();

          }

          return;
        }


        if (event.key === "ArrowRight") {

          pageFlip.flipNext("bottom");

        }


        if (event.key === "ArrowLeft") {

          pageFlip.flipPrev("bottom");

        }

      }
    );

  </script>
