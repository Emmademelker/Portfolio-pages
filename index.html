<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emma de Melker Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .book {
      position: relative;
      width: min(88vw, 1200px);
      aspect-ratio: 1.414 / 1;
      perspective: 2500px;
    }

    .page {
      position: absolute;
      inset: 0;
      background: #ffffff;
      transform-origin: left center;
      transition: transform 0.85s cubic-bezier(.65,.05,.36,1),
                  opacity 0.3s ease;
      backface-visibility: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.10);
      cursor: pointer;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      background: white;
    }

    .page.flipped {
      transform: rotateY(-180deg);
      pointer-events: none;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 500;
      border: none;
      background: none;
      font-size: 32px;
      font-weight: 300;
      cursor: pointer;
      color: #111;
      opacity: 0.45;
      padding: 20px;
      transition: opacity 0.2s ease;
    }

    .arrow:hover {
      opacity: 1;
    }

    .arrow-left {
      left: 1.5%;
    }

    .arrow-right {
      right: 1.5%;
    }

    .counter {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: #111;
      opacity: 0.4;
      z-index: 500;
    }

    @media (max-width: 700px) {
      .book {
        width: 94vw;
      }

      .arrow {
        font-size: 22px;
        padding: 10px;
      }

      .arrow-left {
        left: 0;
      }

      .arrow-right {
        right: 0;
      }
    }
  </style>
</head>

<body>

  <div class="viewer">

    <button class="arrow arrow-left" id="prev">←</button>

    <div class="book" id="book"></div>

    <button class="arrow arrow-right" id="next">→</button>

    <div class="counter" id="counter">01 / 49</div>

  </div>

  <script>
    const TOTAL_PAGES = 49;

    const baseURL =
      "https://raw.githubusercontent.com/Emmademelker/Portfolio-pages/main/";

    const book = document.getElementById("book");
    const counter = document.getElementById("counter");

    let currentPage = 0;
    const pages = [];

    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const page = document.createElement("div");
      page.className = "page";

      const img = document.createElement("img");
      img.src = baseURL + i + ".jpg";
      img.alt = "Portfolio page " + i;

      page.appendChild(img);
      book.appendChild(page);

      pages.push(page);
    }

    pages.forEach((page, index) => {
      page.style.zIndex = TOTAL_PAGES - index;
    });

    function updateCounter() {
      counter.textContent =
        String(currentPage + 1).padStart(2, "0") +
        " / " +
        String(TOTAL_PAGES).padStart(2, "0");
    }

    function nextPage() {
      if (currentPage >= TOTAL_PAGES - 1) return;

      pages[currentPage].classList.add("flipped");
      currentPage++;

      updateCounter();
    }

    function previousPage() {
      if (currentPage <= 0) return;

      currentPage--;

      pages[currentPage].classList.remove("flipped");

      updateCounter();
    }

    document.getElementById("next").addEventListener("click", nextPage);
    document.getElementById("prev").addEventListener("click", previousPage);

    pages.forEach(page => {
      page.addEventListener("click", nextPage);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") nextPage();
      if (event.key === "ArrowLeft") previousPage();
    });

    let startX = null;

    book.addEventListener("pointerdown", event => {
      startX = event.clientX;
    });

    book.addEventListener("pointerup", event => {
      if (startX === null) return;

      const movement = event.clientX - startX;

      if (movement < -60) nextPage();
      if (movement > 60) previousPage();

      startX = null;
    });

    updateCounter();
  </script>

</body>
</html>
