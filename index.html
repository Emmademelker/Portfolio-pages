  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    /* --------------------------------
       INTRO COVER
    -------------------------------- */

    #introCover {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      pointer-events: auto;
    }

    #introCover img {
      width: min(42vw, 620px);
      height: auto;
      display: block;

      cursor: pointer;

      transform:
        translateX(0)
        rotate(-4deg)
        scale(1);

      transform-origin: center center;

      transition:
        transform 1.05s cubic-bezier(.22,.8,.25,1),
        opacity .35s ease;
    }

    #introCover:hover img {
      transform:
        translateX(0)
        rotate(-2deg)
        scale(1.02);
    }

    /*
      Once clicked:
      move RIGHT by half the cover width.
      Because the cover width itself is responsive,
      we use 21vw, capped at 310px.
    */

    #introCover.move-right img {
      transform:
        translateX(min(21vw, 310px))
        rotate(0deg)
        scale(1);
    }

    #introCover.hide {
      pointer-events: none;
    }

    #introCover.hide img {
      opacity: 0;
    }

    /* --------------------------------
       REAL BOOK
    -------------------------------- */

    #bookStage {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 5vh 7vw;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity .25s ease;
    }

    #bookStage.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #book {
      width: 100%;
      height: 100%;
    }

    .page {
      background: #fff;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #fff;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* --------------------------------
       MOBILE
    -------------------------------- */

    @media (max-width: 800px) {

      #introCover img {
        width: min(72vw, 520px);
      }

      #introCover.move-right img {
        transform:
          translateX(min(36vw, 260px))
          rotate(0deg)
          scale(1);
      }

      #bookStage {
        padding: 3vh 2vw;
      }

    }
  </style>
</head>

  <script>
    const introCover = document.getElementById("introCover");
    const bookStage = document.getElementById("bookStage");
    const bookElement = document.getElementById("book");

    const pageFlip = new St.PageFlip(bookElement, {
      width: 720,
      height: 509,

      size: "stretch",

      minWidth: 300,
      maxWidth: 850,

      minHeight: 212,
      maxHeight: 601,

      showCover: true,

      drawShadow: true,
      maxShadowOpacity: 0.25,

      flippingTime: 1350,

      mobileScrollSupport: false,

      usePortrait: true,

      startPage: 0,

      clickEventForward: true,
      useMouseEvents: true,

      swipeDistance: 25,

      showPageCorners: true,

      disableFlipByClick: false
    });

    pageFlip.loadFromHTML(
      document.querySelectorAll(".page")
    );

    let opened = false;

    function openPortfolio() {
      if (opened) return;

      opened = true;

      /*
        1. Closed book moves from
        exact center -> right side
      */
      introCover.classList.add("move-right");

      /*
        2. Reveal the real PageFlip cover
        once the intro has nearly reached
        the right-hand page position
      */
      setTimeout(() => {
        bookStage.classList.add("visible");
      }, 850);

      /*
        3. Fade away fake intro cover.
        The real PageFlip cover is now underneath
        in virtually the same position.
      */
      setTimeout(() => {
        introCover.classList.add("hide");
      }, 1020);

      /*
        4. Open cover LEFT into the full spread.
      */
      setTimeout(() => {
        pageFlip.flipNext("bottom");
      }, 1080);
    }

    introCover.addEventListener("click", openPortfolio);

    document.addEventListener("keydown", event => {

      if (!opened) {
        if (
          event.key === "Enter" ||
          event.key === "ArrowRight"
        ) {
          openPortfolio();
        }

        return;
      }

      if (event.key === "ArrowRight") {
        pageFlip.flipNext("bottom");
      }

      if (event.key === "ArrowLeft") {
        pageFlip.flipPrev("bottom");
      }
    });
  </script>
