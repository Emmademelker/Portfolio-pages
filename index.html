  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    /* INTRO COVER */

    #introCover {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;

      opacity: 1;

      transition:
        opacity .45s ease;
    }

    #introCover img {
      width: min(42vw, 620px);
      height: auto;
      display: block;

      cursor: pointer;

      transform:
        rotate(-4deg)
        scale(1);

      transform-origin: center center;

      transition:
        transform .8s cubic-bezier(.22,.8,.25,1);
    }

    #introCover:hover img {
      transform:
        rotate(-2deg)
        scale(1.02);
    }

    #introCover.straight img {
      transform:
        rotate(0deg)
        scale(.98);
    }

    #introCover.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* REAL BOOK */

    #bookStage {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 5vh 7vw;

      opacity: 0;
      pointer-events: none;

      transform: scale(.98);

      transition:
        opacity .5s ease,
        transform .65s cubic-bezier(.22,.8,.25,1);
    }

    #bookStage.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    #book {
      width: 100%;
      height: 100%;
    }

    .page {
      background: #fff;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #fff;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 800px) {
      #introCover img {
        width: min(72vw, 520px);
      }

      #bookStage {
        padding: 3vh 2vw;
      }
    }
  </style>
</head>

  <script>
    const introCover =
      document.getElementById("introCover");

    const bookStage =
      document.getElementById("bookStage");

    const bookElement =
      document.getElementById("book");

    const pageFlip =
      new St.PageFlip(bookElement, {

        width: 720,
        height: 509,

        size: "stretch",

        minWidth: 300,
        maxWidth: 850,

        minHeight: 212,
        maxHeight: 601,

        showCover: true,

        drawShadow: true,

        maxShadowOpacity: 0.20,

        flippingTime: 1200,

        mobileScrollSupport: false,

        usePortrait: true,

        startPage: 0,

        clickEventForward: true,

        useMouseEvents: true,

        swipeDistance: 25,

        showPageCorners: true,

        disableFlipByClick: false
      });

    pageFlip.loadFromHTML(
      document.querySelectorAll(".page")
    );

    let opened = false;

    function openPortfolio() {

      if (opened) return;

      opened = true;

      // 1. straighten the centered cover
      introCover.classList.add("straight");

      // 2. reveal the real book in the same center position
      setTimeout(() => {
        bookStage.classList.add("visible");
      }, 450);

      // 3. fade the fake intro cover out
      setTimeout(() => {
        introCover.classList.add("hide");
      }, 650);

      // 4. let the REAL book open naturally
      setTimeout(() => {
        pageFlip.flipNext("bottom");
      }, 850);
    }

    introCover.addEventListener(
      "click",
      openPortfolio
    );

    document.addEventListener(
      "keydown",
      event => {

        if (!opened) {

          if (
            event.key === "Enter" ||
            event.key === "ArrowRight"
          ) {
            openPortfolio();
          }

          return;
        }

        if (event.key === "ArrowRight") {
          pageFlip.flipNext("bottom");
        }

        if (event.key === "ArrowLeft") {
          pageFlip.flipPrev("bottom");
        }
      }
    );
  </script>
